<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mappemonde</title>
<meta name="description" content="Quiz de géographie : capitales, drapeaux, États américains">
<meta name="theme-color" content="#0B1F2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mappemonde">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<style>
:root{
  --abysse:#0B1F2A;
  --plateau:#153845;
  --plateau-clair:#1D4A5C;
  --parchemin:#F4ECDC;
  --second:#C8DBE1;
  --etiquette:#A9C8D2;
  --trait:#4E7D8B;
  --oxyde:#C0492F;
  --sonde:#6E9C6B;
  --serif:Baskerville,"Iowan Old Style",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html{font-size:100%;background:var(--abysse);color-scheme:dark}
html[data-taille="grand"]{font-size:115%}
html[data-taille="tres-grand"]{font-size:132%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  background:var(--abysse);
  color:var(--parchemin);
  font-family:var(--sans);
  min-height:100vh;
  padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
/* Graticule : le quadrillage lat/long d'un atlas */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right,rgba(78,125,139,.16) 0 1px,transparent 1px 56px),
    repeating-linear-gradient(to bottom,rgba(78,125,139,.16) 0 1px,transparent 1px 56px);
  mask-image:radial-gradient(ellipse at 50% 38%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 38%,#000 20%,transparent 78%);
}
.feuille{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-top:26px}

.eyebrow{
  font-family:var(--sans);font-size:.85rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--etiquette);
}
h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,13vw,3.6rem);
  letter-spacing:.02em;line-height:1;margin:8px 0 6px;
}
.sous-titre{font-size:1.05rem;line-height:1.5;color:var(--second);margin-bottom:30px}

/* Accueil : trois plaques */
.plaque{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--plateau);border:1px solid #21506380;border-radius:3px;
  color:var(--parchemin);padding:20px 18px;margin-bottom:12px;cursor:pointer;
  font:inherit;transition:background .18s ease,transform .18s ease;
}
.plaque:hover{background:var(--plateau-clair)}
.plaque:active{transform:translateY(1px)}
.plaque .glyphe{font-size:1.9rem;line-height:1;width:36px;flex:none;text-align:center}
.plaque .texte{flex:1;min-width:0}
.plaque .nom{display:block;font-family:var(--sans);font-weight:600;font-size:1.3rem;line-height:1.25}
.plaque .detail{display:block;font-size:.92rem;color:var(--second);margin-top:5px;line-height:1.35}
.plaque .record{
  margin-left:auto;flex:none;font-size:.85rem;font-weight:600;
  color:var(--etiquette);text-align:right;white-space:nowrap;line-height:1.35;
}
.pied{
  font-size:.9rem;color:#9BBAC4;margin-top:30px;line-height:1.7;
}

/* Barre de progression : une règle graduée */
.entete{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px}
.entete .mode{font-size:.9rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--etiquette)}
.quitter{background:none;border:none;color:var(--etiquette);font-family:var(--sans);font-size:.9rem;
  font-weight:600;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;padding:4px}
.quitter:hover{color:var(--parchemin)}
.regle{display:flex;gap:4px;margin-bottom:20px}
.regle span{flex:1;height:5px;background:#25525F}
.regle span.juste{background:var(--sonde)}
.regle span.faux{background:var(--oxyde)}
.regle span.active{background:var(--parchemin)}

.question{font-family:var(--sans);font-weight:600;font-size:1.85rem;line-height:1.25;margin-bottom:8px}
.drapeau{font-size:5.6rem;line-height:1.1;margin-bottom:12px;letter-spacing:0}
.consigne{font-size:.95rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--etiquette);margin-bottom:14px;line-height:1.4}

/* Mode carte */
.carte-boite{
  position:relative;width:100%;aspect-ratio:1000/500;
  background:#0E2733;border:1px solid #2A6072;border-radius:2px;
  margin-bottom:14px;overflow:hidden;
}
.carte-boite svg{width:100%;height:100%;display:block}
.carte-boite svg[hidden]{display:none}
.carte-boite path{fill:#27596B;stroke:#0B1F2A;stroke-width:.7;vector-effect:non-scaling-stroke}
.carte-boite path.fond{fill:#1D4353}
.carte-boite path.cible{fill:var(--parchemin)}
.carte-boite circle{fill:none;stroke:var(--parchemin);opacity:.5}

.consigne.intrus,.consigne.voisin{
  display:inline-block;padding:8px 15px;border-radius:3px;
  letter-spacing:.08em;margin-bottom:16px;
}
.consigne.intrus{background:#42251E;color:#F6CFC5;border:1px solid var(--oxyde)}
.consigne.voisin{background:#1E463C;color:#D9F0D3;border:1px solid var(--sonde)}

.reponses{display:flex;flex-direction:column;gap:8px}
.reponse{
  background:var(--plateau);border:1px solid #2A6072;border-left:4px solid var(--trait);
  border-radius:2px;color:var(--parchemin);font:inherit;font-size:1.2rem;line-height:1.35;
  padding:15px 18px;text-align:left;cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
  animation:monte .28s ease both;
}
.reponse:nth-child(2){animation-delay:.04s}
.reponse:nth-child(3){animation-delay:.08s}
.reponse:nth-child(4){animation-delay:.12s}
@keyframes monte{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.reponse:hover:not(:disabled){background:var(--plateau-clair)}
.reponse:disabled{cursor:default}
.reponse.juste{border-left-color:var(--sonde);background:#1E463C;color:#D9F0D3}
.reponse.faux{border-left-color:var(--oxyde);background:#42251E;color:#F6CFC5}
.reponse:focus-visible{outline:2px solid var(--parchemin);outline-offset:2px}

.verdict{margin-top:12px;min-height:24px;font-size:1.1rem;line-height:1.45;color:var(--second)}
.verdict strong{color:var(--parchemin);font-weight:700}
.suivant{
  width:100%;margin-top:12px;padding:17px;background:var(--parchemin);color:var(--abysse);
  border:none;border-radius:2px;font-family:var(--sans);font-size:1.05rem;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
}
.suivant:hover{background:#fff}

/* Fin de manche */
.score{font-family:var(--serif);font-size:5rem;line-height:1;margin:10px 0 4px}
.score small{font-size:2rem;color:var(--etiquette)}
.bilan{color:var(--second);font-size:1.05rem;margin-bottom:30px;line-height:1.55}
/* Récapitulatif des erreurs */
.revoir{margin-bottom:30px}
.revoir h2{
  font-family:var(--sans);font-size:.9rem;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--etiquette);
  padding-bottom:9px;border-bottom:1px solid #2A6072;margin-bottom:4px;
}
.rate{display:flex;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid #1F4757}
.rate .invite{flex:1;font-family:var(--sans);font-weight:600;font-size:1.15rem;line-height:1.3}
.rate .invite .drap{font-size:1.9rem}
.rate .bonne{text-align:right;color:#B6DDB0;font-size:1.05rem;line-height:1.3}
.rate .tien{display:block;margin-top:4px;color:#C08D80;font-size:.9rem;text-decoration:line-through}

.secondaire{
  width:100%;margin-top:10px;padding:19px;background:none;color:var(--parchemin);
  border:1px solid var(--etiquette);border-radius:2px;font-family:var(--sans);font-size:1.05rem;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
}
.secondaire:hover{background:var(--plateau)}

/* Réglage de la taille du texte */
.taille{display:flex;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.taille .titre{font-size:.9rem;font-weight:600;color:var(--etiquette);
  text-transform:uppercase;letter-spacing:.06em;width:100%}
.taille button{
  flex:1;min-width:70px;padding:14px 10px;background:none;color:var(--parchemin);
  border:1px solid #2A6072;border-radius:2px;font-family:var(--sans);cursor:pointer;
}
.taille button:nth-child(2){font-size:1rem}
.taille button:nth-child(3){font-size:1.25rem}
.taille button:nth-child(4){font-size:1.5rem}
.taille button[aria-pressed="true"]{background:var(--parchemin);color:var(--abysse);border-color:var(--parchemin);font-weight:700}

.ecran{display:none}
.ecran.visible{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="feuille">

  <!-- ACCUEIL -->
  <section class="ecran visible" id="accueil">
    <p class="eyebrow">Quiz de géographie</p>
    <h1>Mappemonde</h1>
    <p class="sous-titre">Dix questions par manche. Choisis ton terrain.</p>

    <button class="plaque" data-mode="capitales">
      <span class="glyphe">◉</span>
      <span class="texte">
        <span class="nom">Capitales du monde</span>
        <span class="detail" id="nbPays"></span>
      </span>
      <span class="record" id="recCapitales"></span>
    </button>

    <button class="plaque" data-mode="drapeaux">
      <span class="glyphe">⚑</span>
      <span class="texte">
        <span class="nom">Drapeaux</span>
        <span class="detail">Reconnaître le pays</span>
      </span>
      <span class="record" id="recDrapeaux"></span>
    </button>

    <button class="plaque" data-mode="carte">
      <span class="glyphe">◍</span>
      <span class="texte">
        <span class="nom">Carte du monde</span>
        <span class="detail">Reconnaître le pays surligné</span>
      </span>
      <span class="record" id="recCarte"></span>
    </button>

    <button class="plaque" data-mode="usa">
      <span class="glyphe">★</span>
      <span class="texte">
        <span class="nom">États américains</span>
        <span class="detail">Les 50 États et leurs capitales</span>
      </span>
      <span class="record" id="recUsa"></span>
    </button>

    <button class="plaque" data-mode="frontieres">
      <span class="glyphe">⛊</span>
      <span class="texte">
        <span class="nom">Frontières</span>
        <span class="detail" id="nbFrontieres"></span>
      </span>
      <span class="record" id="recFrontieres"></span>
    </button>

    <button class="plaque" data-mode="carteusa">
      <span class="glyphe">◈</span>
      <span class="texte">
        <span class="nom">Carte des États-Unis</span>
        <span class="detail">Reconnaître l'État surligné</span>
      </span>
      <span class="record" id="recCarteUsa"></span>
    </button>

    <button class="plaque" data-mode="frontieresusa">
      <span class="glyphe">⛉</span>
      <span class="texte">
        <span class="nom">Frontières des États-Unis</span>
        <span class="detail" id="nbFrontieresUsa"></span>
      </span>
      <span class="record" id="recFrontieresUsa"></span>
    </button>

    <div class="taille" id="taille">
      <span class="titre">Taille du texte</span>
      <button data-taille="normal" aria-pressed="false">Aa</button>
      <button data-taille="grand" aria-pressed="false">Aa</button>
      <button data-taille="tres-grand" aria-pressed="false">Aa</button>
    </div>

    <p class="pied">
      Fonctionne hors ligne · Aucune donnée envoyée<br>
      Scores conservés sur cet appareil<br>
      <span id="totalParties"></span>
    </p>
  </section>

  <!-- JEU -->
  <section class="ecran" id="jeu">
    <div class="entete">
      <span class="mode" id="modeEnCours"></span>
      <button class="quitter" id="btnQuitter">Quitter</button>
    </div>
    <div class="regle" id="regle"></div>

/* ---------- Outils ---------- */
const CLE='mappemonde.v1';
const LONGUEUR=10;
const $=id=>document.getElementById(id);
const drapeauDe=code=>String.fromCodePoint(...[...code].map(c=>0x1F1E6+c.charCodeAt(0)-65));
const melange=t=>{const a=[...t];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function lire(){
  try{return JSON.parse(localStorage.getItem(CLE))||{records:{},parties:0};}
  catch(e){return {records:{},parties:0};}
}
function ecrire(d){
  try{localStorage.setItem(CLE,JSON.stringify(d));}catch(e){/* stockage indisponible */}
}

const LIBELLES={capitales:'Capitales du monde',drapeaux:'Drapeaux',carte:'Carte du monde',usa:'États américains',carteusa:'Carte des États-Unis',frontieres:'Frontières',frontieresusa:'Frontières des États-Unis'};

/* ---------- Fabrication des questions ---------- */
function fabrique(mode){
  if(mode==='usa'){
    return melange(ETATS).slice(0,LONGUEUR).map(etat=>{
      const inverse=Math.random()<.4;
      const leurres=melange(ETATS.filter(e=>e[0]!==etat[0])).slice(0,3);
      return inverse
        ? {consigne:'De quel État est-elle la capitale ?',question:etat[1],
           bonne:etat[0],options:melange([etat[0],...leurres.map(e=>e[0])])}
        : {consigne:'Quelle est sa capitale ?',question:etat[0],
           bonne:etat[1],options:melange([etat[1],...leurres.map(e=>e[1])])};
    });
  }
  if(mode==='frontieresusa'){
    const sujets=ETATS.filter(e=>VOISINSUS[e[0]]);
    return melange(sujets).slice(0,LONGUEUR).map(etat=>{
      const vs=VOISINSUS[etat[0]];
      const exclus=new Set([etat[0]].concat(vs));
      const d2=new Set();
      vs.forEach(n=>(VOISINSUS[n]||[]).forEach(x=>d2.add(x)));
      exclus.forEach(x=>d2.delete(x));
      const hors=melange(ETATS.filter(e=>d2.has(e[0])))
        .concat(melange(ETATS.filter(e=>!exclus.has(e[0])&&!d2.has(e[0]))));
      const base={etat:CARTESUS[etat[0]],question:etat[0]};
      if(vs.length>=3){
        const trois=melange(vs).slice(0,3);
        const intrus=hors[0][0];
        return Object.assign({},base,{consigne:'Sans frontière',forme:'intrus',
          bonne:intrus,options:melange([intrus].concat(trois))});
      }
      const bon=melange(vs)[0];
      const leurres=hors.slice(0,3).map(e=>e[0]);
      return Object.assign({},base,{consigne:'Voisin',forme:'voisin',
        bonne:bon,options:melange([bon].concat(leurres))});
    });
  }
  if(mode==='frontieres'){
    const nom=c=>{const p=PAYS.find(x=>x[0]===c);return p?p[1]:c;};
    const sujets=PAYS.filter(p=>VOISINS[p[0]]);
    return melange(sujets).slice(0,LONGUEUR).map(pays=>{
      const vs=VOISINS[pays[0]];
      const exclus=new Set([pays[0]].concat(vs));
      const d2=new Set();
      vs.forEach(n=>(VOISINS[n]||[]).forEach(x=>d2.add(x)));
      exclus.forEach(x=>d2.delete(x));
      const horsZone=melange(PAYS.filter(p=>d2.has(p[0])))
        .concat(melange(PAYS.filter(p=>!exclus.has(p[0])&&!d2.has(p[0])&&p[3]===pays[3])))
        .concat(melange(PAYS.filter(p=>!exclus.has(p[0])&&!d2.has(p[0])&&p[3]!==pays[3])));
      const base={carte:CARTES[pays[0]]?pays[0]:null,question:pays[1]};
      if(vs.length>=3){
        const trois=melange(vs).slice(0,3).map(nom);
        const intrus=horsZone[0][1];
        return Object.assign({},base,{consigne:'Sans frontière',forme:'intrus',
          bonne:intrus,options:melange([intrus].concat(trois))});
      }
      const bon=nom(melange(vs)[0]);
      const leurres=horsZone.slice(0,3).map(p=>p[1]);
      return Object.assign({},base,{consigne:'Voisin',forme:'voisin',
        bonne:bon,options:melange([bon].concat(leurres))});
    });
  }
  if(mode==='carteusa'){
    const dispo=ETATS.filter(e=>CARTESUS[e[0]]);
    return melange(dispo).slice(0,LONGUEUR).map(etat=>{
      const leurres=melange(ETATS.filter(e=>e[0]!==etat[0])).slice(0,3);
      return {etat:CARTESUS[etat[0]],consigne:'Quel État est surligné ?',question:'',
              bonne:etat[0],options:melange([etat[0],...leurres.map(e=>e[0])])};
    });
  }
  if(mode==='carte'){
    const dispo=PAYS.filter(p=>CARTES[p[0]]);
    return melange(dispo).slice(0,LONGUEUR).map(pays=>{
      const memeZone=PAYS.filter(p=>p[3]===pays[3]&&p[0]!==pays[0]);
      const vivier=memeZone.length>=3?memeZone:PAYS.filter(p=>p[0]!==pays[0]);
      const leurres=melange(vivier).slice(0,3);
      return {carte:pays[0],consigne:'Quel pays est surlign\u00e9 ?',question:'',
              bonne:pays[1],options:melange([pays[1],...leurres.map(p=>p[1])])};
    });
  }
  return melange(PAYS).slice(0,LONGUEUR).map(pays=>{
    const memeZone=PAYS.filter(p=>p[3]===pays[3]&&p[0]!==pays[0]);
    const vivier=memeZone.length>=3?memeZone:PAYS.filter(p=>p[0]!==pays[0]);
    const leurres=melange(vivier).slice(0,3);
    if(mode==='drapeaux'){
      return {drapeau:drapeauDe(pays[0]),consigne:'Quel est ce pays ?',question:'',
              bonne:pays[1],options:melange([pays[1],...leurres.map(p=>p[1])])};
    }
    const inverse=Math.random()<.35;
    return inverse
      ? {consigne:'De quel pays est-elle la capitale ?',question:pays[2],
         bonne:pays[1],options:melange([pays[1],...leurres.map(p=>p[1])])}
      : {consigne:'Quelle est sa capitale ?',question:pays[1],
         bonne:pays[2],options:melange([pays[2],...leurres.map(p=>p[2])])};
  });
}

/* ---------- Déroulement ---------- */
let manche=[],index=0,score=0,mode=null,rates=[];

function ecran(id){
  document.querySelectorAll('.ecran').forEach(s=>s.classList.toggle('visible',s.id===id));
  window.scrollTo(0,0);
}

function demarrer(m){
  mode=m;manche=fabrique(m);index=0;score=0;rates=[];
  $('modeEnCours').textContent=LIBELLES[m];
  $('regle').innerHTML=Array.from({length:LONGUEUR},()=>'<span></span>').join('');
  ecran('jeu');
  poser();
}

function cadrer(cible,b,us){
  $('carte').style.display=us?'none':'block';
  $('carteus').style.display=us?'block':'none';
  const svg=us?$('carteus'):$('carte');
  const H=us?US_H:394;
  document.querySelectorAll('.carte-boite path.cible').forEach(p=>p.classList.remove('cible'));
  const el=document.getElementById(cible);
  if(el)el.classList.add('cible');
  const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2;
  const etendue=Math.max(b[2]-b[0],(b[3]-b[1])/0.5);
  const w=Math.min(Math.max(etendue*3.2,45),1000);
  const h=w*0.5;
  const vx=Math.min(Math.max(cx-w/2,0),Math.max(1000-w,0));
  const vy=Math.min(Math.max(cy-h/2,0),Math.max(H-h,0));
  svg.setAttribute('viewBox',vx+' '+vy+' '+w+' '+h);
  const rep=us?$('repereus'):$('repere');
  rep.setAttribute('cx',cx);
  rep.setAttribute('cy',cy);
  rep.setAttribute('r',Math.max(Math.max(b[2]-b[0],b[3]-b[1])/2+w*0.025,w*0.035));
  rep.setAttribute('stroke-width',w*0.006);
}

function poser(){
  const q=manche[index];
  const tirets=$('regle').children;
  [...tirets].forEach((t,i)=>t.classList.toggle('active',i===index));

  $('carteBoite').hidden=!(q.carte||q.etat);
  if(q.carte)cadrer('z'+q.carte,CARTES[q.carte],false);
  else if(q.etat)cadrer('u'+q.etat[0],q.etat.slice(1),true);

  $('drapeau').hidden=!q.drapeau;
  $('drapeau').textContent=q.drapeau||'';
  $('consigne').textContent=q.consigne;
  $('consigne').className='consigne'+(q.forme?' '+q.forme:'');
  $('question').textContent=q.question;
  $('question').hidden=!q.question;
  $('verdict').textContent='';
  $('btnSuivant').hidden=true;

  const zone=$('reponses');
  zone.innerHTML='';
  q.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='reponse';
    b.textContent=opt;
    b.addEventListener('click',()=>repondre(b,opt,q));
    zone.appendChild(b);
  });
}

function repondre(bouton,choix,q){
  const juste=choix===q.bonne;
  if(juste)score++;
  else rates.push({
    invite:q.drapeau?'<span class="drap">'+q.drapeau+'</span>':
           q.carte?'<span class="drap">'+drapeauDe(q.carte)+'</span>':
           q.etat?q.etat[0]:q.question,
    bonne:q.bonne,
    choix:choix
  });
  $('regle').children[index].classList.add(juste?'juste':'faux');

  [...$('reponses').children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.bonne)b.classList.add('juste');
  });
  if(!juste)bouton.classList.add('faux');

  $('verdict').innerHTML=juste
    ? 'Exact.'
    : 'C\'était <strong>'+q.bonne+'</strong>.';

  $('btnSuivant').hidden=false;
  $('btnSuivant').textContent=index===LONGUEUR-1?'Voir le résultat':'Suivant';
}

function suivant(){
  index++;
  if(index<LONGUEUR){poser();return;}
  terminer();
}

function terminer(){
  const d=lire();
  const ancien=d.records[mode]||0;
  const nouveau=score>ancien;
  d.records[mode]=Math.max(ancien,score);
  d.parties=(d.parties||0)+1;
  ecrire(d);

  $('modeFini').textContent=LIBELLES[mode];
  $('scoreFinal').textContent=score;
  let phrase;
  if(nouveau&&score>0)phrase='Nouveau record sur ce terrain.';
  else if(score===10)phrase='Sans faute. Difficile de faire mieux.';
  else if(score>=7)phrase='Solide. Le podium n\'est pas loin.';
  else if(score>=4)phrase='La moitié du chemin. Une autre manche ?';
  else phrase='Le monde est vaste. On recommence ?';
  $('bilan').textContent=phrase+' Meilleur score : '+d.records[mode]+' / 10.';
  afficherRates();
  rafraichirAccueil();
  ecran('fin');
}

function afficherRates(){
  const zone=$('revoir');
  if(!rates.length){zone.innerHTML='';return;}
  zone.innerHTML='<h2>À revoir — '+rates.length+' erreur'+(rates.length>1?'s':'')+'</h2>'+
    rates.map(r=>
      '<div class="rate">'+
        '<span class="invite">'+r.invite+'</span>'+
        '<span class="bonne">'+r.bonne+'<span class="tien">'+r.choix+'</span></span>'+
      '</div>').join('');
}

function rafraichirAccueil(){
  const d=lire();
  const aff=m=>d.records[m]!==undefined?'Record<br>'+d.records[m]+'/10':'Jamais joué';
  $('recCapitales').innerHTML=aff('capitales');
  $('recDrapeaux').innerHTML=aff('drapeaux');
  $('recCarte').innerHTML=aff('carte');
  $('recUsa').innerHTML=aff('usa');
  $('recCarteUsa').innerHTML=aff('carteusa');
  $('recFrontieres').innerHTML=aff('frontieres');
  $('recFrontieresUsa').innerHTML=aff('frontieresusa');
  $('nbPays').textContent=PAYS.length+' pays, tous continents';
  document.querySelector('[data-mode="carte"] .detail').textContent=Object.keys(CARTES).length+' pays cartographi\u00e9s';
  $('nbFrontieres').textContent=Object.keys(VOISINS).length+' pays \u00e0 fronti\u00e8res';
  $('nbFrontieresUsa').textContent=Object.keys(VOISINSUS).length+' \u00c9tats \u00e0 fronti\u00e8res';
  $('totalParties').textContent=d.parties?d.parties+' manche'+(d.parties>1?'s':'')+' jouée'+(d.parties>1?'s':''):'';
}

/* ---------- Taille du texte ---------- */
function appliquerTaille(t){
  document.documentElement.dataset.taille=t;
  document.querySelectorAll('#taille button').forEach(b=>
    b.setAttribute('aria-pressed',String(b.dataset.taille===t)));
  const d=lire();d.taille=t;ecrire(d);
}
document.querySelectorAll('#taille button').forEach(b=>
  b.addEventListener('click',()=>appliquerTaille(b.dataset.taille)));
appliquerTaille(lire().taille||'normal');

/* ---------- Branchements ---------- */
document.querySelectorAll('.plaque').forEach(b=>
  b.addEventListener('click',()=>demarrer(b.dataset.mode)));
$('btnSuivant').addEventListener('click',suivant);
$('btnRejouer').addEventListener('click',()=>demarrer(mode));
$('btnAccueil').addEventListener('click',()=>{rafraichirAccueil();ecran('accueil');});
$('btnQuitter').addEventListener('click',()=>{rafraichirAccueil();ecran('accueil');});

rafraichirAccueil();
</script>
